# Baut die iOS-App, signiert sie automatisch und lädt sie zu TestFlight hoch.
# Läuft nur, wenn diese GitHub-Secrets hinterlegt sind (Settings → Secrets and variables → Actions):
#   APPSTORE_KEY_ID      Schlüssel-ID des App-Store-Connect-API-Schlüssels
#   APPSTORE_ISSUER_ID   Issuer-ID (steht über der Schlüsselliste in App Store Connect)
#   APPSTORE_KEY_P8      Kompletter Inhalt der heruntergeladenen AuthKey_XXXX.p8-Datei
#   APPLE_TEAM_ID        Team-ID (developer.apple.com → Account → Membership details)
name: iOS zu TestFlight

on:
  push:
    branches: [main, claude/breathwork-beginner-apps-moxpmk]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: true

jobs:
  upload:
    runs-on: macos-latest
    env:
      HAS_KEY: ${{ secrets.APPSTORE_KEY_P8 != '' }}
    steps:
      - name: Hinweis, falls Apple-Schlüssel fehlt
        if: env.HAS_KEY != 'true'
        run: echo "::notice::TestFlight-Upload übersprungen – Apple-Secrets sind noch nicht hinterlegt."

      - uses: actions/checkout@v5
        if: env.HAS_KEY == 'true'

      - uses: actions/setup-node@v5
        if: env.HAS_KEY == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Web-App in die iOS-App übernehmen
        if: env.HAS_KEY == 'true'
        run: |
          npm ci
          npm run build:web
          npx cap sync ios

      - name: API-Schlüssel bereitstellen
        if: env.HAS_KEY == 'true'
        env:
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archiv bauen und automatisch signieren
        if: env.HAS_KEY == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" MARKETING_VERSION="0.1.${{ github.run_number }}" \
            | tail -n 60
          exit ${PIPESTATUS[0]}

      - name: Zu TestFlight hochladen
        if: env.HAS_KEY == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Schlüssel wieder löschen
        if: always() && env.HAS_KEY == 'true'
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
